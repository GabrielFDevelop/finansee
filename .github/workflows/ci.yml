name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar os testes
        run: mvn -B -ntp test

      - name: Guardar os relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-backend
          path: backend/target/surefire-reports

  frontend:
    name: Front-end (testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22   # use a mesma versão do Dockerfile do front-end
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Executar os testes
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build de produção
        run: npm run build

  docker:
    name: Docker (build e teste da stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Criar o .env a partir do modelo
        run: cp .env.example .env

      - name: Construir e subir os containers
        run: docker compose up -d --build

      - name: Aguardar a API responder
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/categorias > /dev/null; then
              echo "API no ar"
              exit 0
            fi
            echo "aguardando a API ($i/40)..."
            sleep 3
          done
          echo "A API não respondeu a tempo"
          exit 1

      - name: Conferir que a migration inseriu as categorias padrão
        run: curl -fsS http://localhost:8080/api/categorias | grep -q "Moradia"

      - name: Conferir que o nginx repassa a API
        run: curl -fsS http://localhost:8081/api/categorias | grep -q "Moradia"

      - name: Conferir a página inicial e o fallback das rotas do Angular
        run: |
          curl -fsS http://localhost:8081/ | grep -q "app-root"
          curl -fsS -o /dev/null http://localhost:8081/despesas

      - name: Criar uma categoria pelo nginx, como o navegador faria
        run: |
          curl -fsS -X POST http://localhost:8081/api/categorias \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8081" \
            -d '{"nome":"Categoria de teste da CI"}'

      - name: Mostrar os logs (em caso de falha)
        if: failure()
        run: docker compose logs

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v