<dialog #dialogo class="dialogo" aria-labelledby="titulo-orcamento">
  <form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    <h2 id="titulo-orcamento">Limite de {{ categoria()?.nome }}</h2>
    <p class="rotulo">{{ mes.rotulo$ | async }}</p>

    <label for="limite">Limite do mês (R$)</label>
    <input id="limite" type="number" step="0.01" min="0.01" formControlName="valorLimite" />
    @if (invalido()) {
      <p class="erro-campo">Informe um valor maior que zero.</p>
    }

    @if (erro()) {
      <p class="erro-campo" role="alert">{{ erro() }}</p>
    }

    <div class="acoes">
      <button type="button" class="botao-secundario" (click)="fechar()">Cancelar</button>
      <button type="submit" class="botao-primario" [disabled]="salvando()">Salvar</button>
    </div>
  </form>
</dialog>
