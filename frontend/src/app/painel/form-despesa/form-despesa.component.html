<dialog #dialogo class="dialogo" aria-labelledby="titulo-nova-despesa">
  <form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    <h2 id="titulo-nova-despesa">Nova despesa</h2>

    <label for="descricao">Descrição</label>
    <input id="descricao" type="text" formControlName="descricao" maxlength="150" />
    @if (invalido('descricao')) {
      <p class="erro-campo">Informe uma descrição.</p>
    }

    <label for="valor">Valor (R$)</label>
    <input id="valor" type="number" step="0.01" min="0.01" formControlName="valor" />
    @if (invalido('valor')) {
      <p class="erro-campo">Informe um valor maior que zero.</p>
    }

    <label for="data">Data</label>
    <input id="data" type="date" formControlName="data" />
    @if (invalido('data')) {
      <p class="erro-campo">Informe a data.</p>
    }

    <label for="categoria">Categoria</label>
    <select id="categoria" formControlName="categoriaId">
      <option [ngValue]="null" disabled>Selecione…</option>
      @for (c of categorias(); track c.id) {
        <option [ngValue]="c.id">{{ c.nome }}</option>
      }
    </select>
    @if (invalido('categoriaId')) {
      <p class="erro-campo">Escolha uma categoria.</p>
    }

    @if (erro()) {
      <p class="erro-campo" role="alert">{{ erro() }}</p>
    }

    <div class="acoes">
      <button type="button" class="botao-secundario" (click)="fechar()">Cancelar</button>
      <button type="submit" class="botao-primario" [disabled]="salvando()">Salvar</button>
    </div>
  </form>
</dialog>
