server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # repassa as chamadas da API para o container do back-end
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
  }

  # qualquer outra rota devolve o index.html (o Angular cuida da navegação)
  location / {
    try_files $uri $uri/ /index.html;
  }
}